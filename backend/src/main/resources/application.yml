spring:
  profiles:
    active: dev
  application:
    name: autopost-saas-backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: "scheduler-pool-"

server:
  port: 8081
  tomcat:
    max-http-form-post-size: 100MB
    max-swallow-size: 100MB

facebook:
  graph-api:
    version: v20.0

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3.5-flash

worker:
  base-url: ${WORKER_BASE_URL:http://localhost:3001}
  urls: ${WORKER_URLS:http://localhost:3001,http://localhost:3002,http://localhost:3003}
