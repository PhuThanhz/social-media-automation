name: Build ToolZutter Personal macOS

on:
  workflow_dispatch:
  push:
    branches: ['codex/personal-macos-*']

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            node_arch: arm64
            java_arch: aarch64
            label: Apple-Silicon
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            node_arch: x64
            java_arch: x64
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.node_arch }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          architecture: ${{ matrix.java_arch }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Prepare bundled backend, Java, worker and Node
        working-directory: frontend
        run: npm run sidecar:prepare
      - name: Build personal DMG
        working-directory: frontend
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run desktop:build:personal:macos -- --target ${{ matrix.target }} --config src-tauri/tauri.personal.macos.conf.json
      - name: Verify bundled runtime startup
        working-directory: frontend
        run: |
          DMG=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -print -quit)
          MOUNT="$RUNNER_TEMP/ToolZutter Personal mounted"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT"' EXIT
          APP="$MOUNT/ToolZutter Personal.app"
          codesign --verify --deep --strict "$APP"
          node scripts/smoke-sidecar.mjs "$APP/Contents/Resources/sidecar"
      - name: Upload installable DMG
        uses: actions/upload-artifact@v4
        with:
          name: ToolZutter-Personal-macOS-${{ matrix.label }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
