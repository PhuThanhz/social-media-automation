name: Build Desktop App (.exe & .dmg)

# Mỗi lần push code lên main → build bản Windows + macOS → tạo GitHub Release
# (app đã cài tự cập nhật qua latest.json) → ghi đè bộ cài lên Google Drive.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '_backup_*/**'
      - 'backups/**'
      - 'license-server/**'
      - 'extension/**'
      - 'scripts/**'
      - 'uploads/**'
      - 'worker/post_results*.json'
      - 'worker/scrape_cache.json'
      - 'worker/page_post_registry.json'

# Push liên tục thì chỉ build bản mới nhất, không huỷ bản đang build dở.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: Set app version
        shell: bash
        run: |
          node -e "const f='frontend/src-tauri/tauri.conf.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.version=process.env.APP_VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2));"
          echo "Building version $APP_VERSION"

      - name: Install frontend dependencies & prepare sidecar
        shell: bash
        run: |
          cd frontend
          npm ci || npm install
          npm run sidecar:prepare

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL || 'https://social-media-automation-750a.onrender.com' }}
          LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
        with:
          projectPath: './frontend'
          tagName: app-v__VERSION__
          releaseName: 'PhuSocial Desktop v__VERSION__'
          releaseBody: 'Bản cập nhật tự động từ commit ${{ github.sha }}'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

  upload-drive:
    needs: [version, build-tauri]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
    steps:
      - name: Skip if Drive not configured
        id: chk
        run: |
          if [ -z "$RCLONE_CONFIG_DATA" ]; then echo "RCLONE_CONFIG secret chưa đặt → bỏ qua upload Drive"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Download installers from release
        if: steps.chk.outputs.ok == 'true'
        run: |
          mkdir dl && cd dl
          gh release download "app-v$VERSION" -R "$GITHUB_REPOSITORY" -p '*-setup.exe' -p '*.dmg'
          ls -la

      - name: Upload to Google Drive (overwrite)
        if: steps.chk.outputs.ok == 'true'
        env:
          WIN_FOLDER: ${{ secrets.DRIVE_WINDOWS_FOLDER_ID }}
          MAC_FOLDER: ${{ secrets.DRIVE_MAC_FOLDER_ID }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          EXE=$(ls dl/*-setup.exe | head -1)
          DMG=$(ls dl/*.dmg | head -1)
          rclone copyto "$EXE" gdrive:PhuSocial-Pro-Setup.exe --drive-root-folder-id "$WIN_FOLDER" -v
          rclone copyto "$DMG" gdrive:PhuSocial-Pro.dmg --drive-root-folder-id "$MAC_FOLDER" -v
          printf 'Phiên bản: %s\nCommit: %s\n' "$VERSION" "$GITHUB_SHA" > version.txt
          rclone copyto version.txt gdrive:version.txt --drive-root-folder-id "$WIN_FOLDER"
          rclone copyto version.txt gdrive:version.txt --drive-root-folder-id "$MAC_FOLDER"
