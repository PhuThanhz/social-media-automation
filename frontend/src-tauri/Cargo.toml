[package]
name = "app"
version = "0.1.0"
description = "ToolZutter Desktop"
authors = ["PhuThanhz"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
personal = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
getrandom = "0.3"
dunce = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
